name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-smoke:
    name: Setup Script Smoke (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run setup.sh (no-run)
        run: ./setup.sh --no-run

  tests-core:
    name: Tests Core (Python 3.12)
    needs: [setup-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  tests-gui:
    name: Tests GUI (PySide6 + xvfb)
    needs: [tests-core]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux GUI runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libx11-xcb1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run GUI-related tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -m unittest discover -s tests -p "test_pyside*.py"
          xvfb-run -a python -m unittest tests.test_commit_controller_helpers tests.test_qt_env_bootstrap

  dist-smoke:
    name: Dist Script Smoke (.deb only)
    needs: [tests-core, tests-gui]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run dist.sh smoke
        run: ./dist.sh --deb-only --no-install --no-open --skip-tests

  build-linux-packages:
    name: Build Linux Packages (.deb/AppImage)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux packages
        run: python scripts/build_linux_packages.py --build-binary
      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp dist/*.deb release/
          cp dist/*.AppImage release/
          sha256sum release/* > release/sha256-linux-packages.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-packages
          path: release/

  build-windows:
    name: Build Windows
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        run: python compile.py
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\git_viewer.exe release\git_viewer-windows.exe
          Get-FileHash release\git_viewer-windows.exe -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Replace($pwd.Path + "\\", "")
          } | Set-Content -Encoding ascii release\sha256-windows.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: release/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-packages, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Flatten artifacts
        run: |
          mkdir -p dist-release
          find release -maxdepth 2 -type f -print0 | xargs -0 -I{} cp {} dist-release/
      - name: Generate checksums
        run: |
          cd dist-release
          sha256sum * > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
